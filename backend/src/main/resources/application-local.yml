server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: e-study-backend
  datasource:
    url: jdbc:h2:mem:estudy;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      repositories:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 520MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

study:
  security:
    jwt-secret: local-development-secret-must-be-at-least-thirty-two-bytes
    jwt-expiration: 8h
  auth:
    student-token-store: memory
    student-token-ttl: 30m
  phone:
    hash-secret: local-development-phone-hash-secret
  storage:
    root: ./data/files
    temp-root: ./data/temp
    token-ttl: 30m
  xiaoe:
    mode: stub

logging:
  level:
    com.huijulh.study: DEBUG
    org.springframework.security: WARN
